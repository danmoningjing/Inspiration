<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>文案生成器</title>
    <style>
        body {
            font-family: Arial;
            max-width: 600px;
            margin: 50px auto;
            text-align: center;
        }
        input {
            width: 80%;
            padding: 10px;
            font-size: 16px;
        }
        button {
            padding: 10px 20px;
            margin-top: 10px;
            font-size: 16px;
            cursor: pointer;
        }
        #result {
            margin-top: 20px;
            text-align: left;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>

    <h1>AI 文案生成器</h1>

    <input id="inputText" placeholder="输入关键词，比如：咖啡" />
    <br>
    <button id="btn" onclick="generate()">生成</button>
<p id="loading" style="display:none;">⏳ 生成中，请稍等...</p>

    <div id="result"></div>

    <script>
async function generate() {
    const text = document.getElementById("inputText").value;
    const resultDiv = document.getElementById("result");
    const loading = document.getElementById("loading");
    const btn = document.getElementById("btn");

    // 👉 显示 loading
    loading.style.display = "block";
    resultDiv.innerText = "";
    btn.disabled = true;

    try {
        const res = await fetch("/generate", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ text })
        });

        const data = await res.json();

        resultDiv.innerText = data.result || data.error;
    } catch (err) {
        resultDiv.innerText = "请求失败，请重试";
    }

    // 👉 结束 loading
    loading.style.display = "none";
    btn.disabled = false;
}
</script>
</body>
</html>
